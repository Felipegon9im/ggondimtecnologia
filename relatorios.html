<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard de Relatórios - G&G Tecnologia</title>
  <style>
    :root {
      --primary: #FF4D00;
      --secondary: #FFA000;
      --bg-color: #0d0f12;
      --card-bg: rgba(255, 255, 255, 0.05);
      --text-main: #ffffff;
      --text-sec: #9ca3af;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }
    .header {
      background: rgba(0,0,0,0.5);
      padding: 20px 40px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 1.5rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    th, td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    th {
      color: var(--text-sec);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tr:hover {
      background: rgba(255,255,255,0.02);
    }
    .badge {
      background: rgba(255, 77, 0, 0.2);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-sec);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 24px;
      border-radius: 12px;
      text-align: center;
    }
    .stat-number {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary);
      margin: 10px 0;
    }
    .stat-label {
      color: var(--text-sec);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Painel de Relatórios</h1>
    <a href="/" style="color: var(--text-sec); text-decoration: none;">&larr; Voltar ao site</a>
  </header>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total de Cliques Capturados</div>
        <div class="stat-number" id="totalClicks">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Status da Conexão</div>
        <div class="stat-number" style="font-size: 1.5rem; margin-top: 25px; color: #4ade80;" id="dbStatus">Carregando...</div>
      </div>
    </div>

    <div class="card">
      <h2>Histórico de Ações</h2>
      <div id="tableContainer">
        <div class="loading">Buscando dados no servidor...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { getClicksData } from '/src/firebase.js';

    async function loadData() {
      const container = document.getElementById('tableContainer');
      const totalClicksEl = document.getElementById('totalClicks');
      const dbStatusEl = document.getElementById('dbStatus');
      
      try {
        const clicks = await getClicksData();
        
        if (clicks.length > 0 && clicks[0].userAgent === 'Mock') {
          dbStatusEl.textContent = "Modo Simulação (Aguardando Chaves)";
          dbStatusEl.style.color = "#facc15";
        } else {
          dbStatusEl.textContent = "Online (Firebase)";
        }

        totalClicksEl.textContent = clicks.length;

        if (clicks.length === 0) {
          container.innerHTML = '<div class="loading">Nenhum clique registrado ainda.</div>';
          return;
        }

        let html = `
          <table>
            <thead>
              <tr>
                <th>Data e Hora</th>
                <th>Ação / Botão</th>
                <th>Página de Origem</th>
              </tr>
            </thead>
            <tbody>
        `;

        clicks.forEach(click => {
          const dateStr = click.timestamp instanceof Date 
            ? click.timestamp.toLocaleString('pt-BR') 
            : new Date().toLocaleString('pt-BR');
            
          html += `
            <tr>
              <td>${dateStr}</td>
              <td><span class="badge">${click.buttonName}</span></td>
              <td style="color: var(--text-sec);">${click.sourcePage}</td>
            </tr>
          `;
        });

        html += `
            </tbody>
          </table>
        `;
        container.innerHTML = html;

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="loading" style="color: #ef4444;">Erro ao carregar os dados. Verifique o console.</div>';
        dbStatusEl.textContent = "Erro";
        dbStatusEl.style.color = "#ef4444";
      }
    }

    loadData();
  </script>
</body>
</html>
