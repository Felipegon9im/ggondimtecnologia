<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#311042" />
      <stop offset="100%" stop-color="#0d0914" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="8" />

  <!-- Open Holy Bible and Rising Sun Ember emblem -->
  <g transform="translate(106, 116) scale(0.6)">
    <!-- Bible Base -->
    <path d="M 60,320 C 140,300 240,330 256,360 C 272,330 372,300 452,320 L 452,140 C 372,120 272,150 256,180 C 240,150 140,120 60,140 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    <!-- Pages -->
    <path d="M 70,305 C 140,288 235,315 250,340 C 265,315 360,288 442,305 L 442,150 C 360,133 265,160 250,185 C 235,160 140,133 70,150 Z" fill="#ffffff" />
    <line x1="250" y1="185" x2="250" y2="340" stroke="#d97706" stroke-width="4" />
    
    <!-- Cross in Center -->
    <path d="M 242,80 L 258,80 L 258,110 L 285,110 L 285,124 L 258,124 L 258,170 L 242,170 L 242,124 L 215,124 L 215,110 L 242,110 Z" fill="#f59e0b" filter="url(#glow)" />
  </g>
</svg>
