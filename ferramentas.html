<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <title>Ferramentas Internas | G&G Tecnologia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #030611;
      --primary: #FF4D00;
      --secondary: #FFA000;
      --text-primary: #F3F4F6;
      --text-secondary: #9CA3AF;
      --text-muted: #6B7280;
      --font-sans: 'Inter', sans-serif;
      --font-heading: 'Outfit', sans-serif;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #auth-screen, #app-screen {
      width: 100%;
      max-width: 600px;
      padding: 32px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-family: var(--font-heading);
      font-size: 2rem;
      margin-bottom: 24px;
      background: linear-gradient(90deg, #fff 0%, #aaa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 span {
      background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.3);
      color: white;
      font-size: 1rem;
      margin-bottom: 16px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
    }
    .btn-primary:hover {
      box-shadow: 0 0 20px rgba(255, 77, 0, 0.4);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .status-msg {
      margin-top: 20px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      min-height: 24px;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,77,0,0.3);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 1s ease-in-out infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

  </style>
</head>
<body>

  <div id="app-screen">
    <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem; margin-bottom: 20px; display: inline-block;">&larr; Voltar ao site</a>
    <h1>yt-dlp <span>Downloader</span></h1>
    <p style="color: var(--text-secondary); margin-bottom: 24px;">Baixe vídeos ou músicas do YouTube, Instagram, Twitter e outros 1000+ sites suportados.</p>
    
    <input type="url" id="url-input" placeholder="Cole a URL do vídeo aqui..." required>
    
    <div class="btn-group">
      <button id="btn-video" class="btn-primary">Baixar Vídeo (MP4)</button>
      <button id="btn-audio" class="btn-secondary">Baixar Áudio (MP3)</button>
    </div>
    
    <div id="status-container" class="status-msg"></div>
  </div>

  <script type="module" src="/src/ferramentas.js"></script>
</body>
</html>
